<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How LLMs Came to Be: Films</title>
<meta name="description" content="Short 3D films from How LLMs Came to Be, one per chapter.">
<style>
  :root { --bg: #070a12; --ink: #e8ecf6; --muted: #8a94b0; --gold: #ffc861; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--gold); }
  h1 { font: italic 400 34px/1.2 Georgia, serif; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .film { margin: 0 0 44px; }
  .film h2 { font-size: 19px; margin: 0 0 10px; }
  .film h2 small { display: block; font: 600 11px/1.6 ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .dl { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .dl a { margin-right: 14px; }
</style>
</head>
<body>
<main>
  <a href="./">← back to the chapters</a>
  <h1>How LLMs Came to Be: films</h1>
  <p class="sub">One short film per chapter. Download links are for sharing; the square cut suits phone feeds.</p>
  <div id="films"></div>
</main>
<script src="data.js?v=7"></script>
<script>
  // file names match tools/render-films.mjs: <chapter>-<scene>-<w>x<h>.mp4
  const list = LESSONS.flatMap((l, i) => l.body.filter((b) => b.scene).map((b) => ({ l, n: i + 1, scene: b.scene })));
  document.getElementById("films").innerHTML = list.map(({ l, n, scene }) => {
    const f = (sz) => `films/${String(n).padStart(2, "0")}-${scene}-${sz}.mp4`;
    return `<section class="film"><h2><small>Chapter ${n} · ${l.year}</small>${l.title}</h2>
      <video controls playsinline preload="metadata" poster="${f("1920x1080").replace(".mp4", ".jpg")}" src="${f("1920x1080")}"></video>
      <div class="dl">Download: <a href="${f("1920x1080")}" download>16:9</a><a href="${f("1080x1080")}" download>square</a><a href="./#${n}">read the chapter</a></div></section>`;
  }).join("");
</script>
</body>
</html>
